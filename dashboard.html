<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - My Store Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>My Store MS</h2>
                <button class="mobile-menu-close" id="closeMenuBtn">&times;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active">Dashboard</a>
                <a href="products.html" class="nav-item">Products</a>
                <a href="new-sale.html" class="nav-item">New Sale</a>
                <a href="stock.html" class="nav-item">Stock</a>
                <a href="reports.html" class="nav-item">Reports</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="logout-btn-full">Logout</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-wrapper">
            <!-- Top Header -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="openMenuBtn">&#9776;</button>
                </div>
                <div class="header-right">
                    <span class="welcome-text">Welcome, <span id="displayUsername">Admin</span></span>
                    <span class="date-text" id="todayDate"></span>
                </div>
            </header>

            <!-- Dashboard Content -->
            <main class="dashboard-content">
                <div class="welcome-banner">
                    <h1>Dashboard Overview</h1>
                    <p>Here is the current status of your store management system.</p>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                    <span class="stat-title">Total Products</span>
                    <span class="stat-value" id="dashboardTotalProducts">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Today's Sales</span>
                    <span class="stat-value" id="dashboardTodaySales">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Total Revenue</span>
                    <span class="stat-value text-blue" id="dashboardTotalRevenue">&#8377;0.00</span>
                </div>
                <div class="stat-card">
                    <span class="stat-title">Low Stock Alerts</span>
                    <span class="stat-value" style="color: var(--error-red);" id="dashboardLowStock">0</span>
                </div>
                </div>
            </main>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
