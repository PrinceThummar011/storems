<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - StoreMS Management System">
    <title>Login - StoreMS Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Login Page Specific Styles */
        body.login-page {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            padding: 50px 40px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .login-logo h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 5px;
        }

        .login-tagline {
            color: #9ca3af;
            font-size: 12px;
        }

        .login-form {
            margin-top: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: #d1d5db;
        }

        .error-message {
            display: none;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            border-left: 4px solid var(--error-red);
            background-color: #fef2f2;
            color: #991b1b;
            animation: shake 0.3s ease-in-out;
        }

        .error-message.show {
            display: block;
        }

        .error-message.success {
            border-left-color: #22c55e;
            background-color: #f0fdf4;
            color: #166534;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .login-btn {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer p {
            color: var(--text-muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .login-footer a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--primary-blue-hover);
            text-decoration: underline;
        }

        .demo-credentials {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #1e40af;
        }

        .demo-credentials strong {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        .demo-credentials code {
            background-color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
            }

            .login-logo h1 {
                font-size: 24px;
            }

            .login-logo-icon {
                font-size: 40px;
            }
        }
    </style>
</head>
<body class="login-page">

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Logo Section -->
            <div class="login-logo">
                <span class="login-logo-icon">🏪</span>
                <h1>StoreMS</h1>
                <p class="login-subtitle">Smart Store Management</p>
                <p class="login-tagline">Manage your inventory with ease</p>
            </div>

            <!-- Demo Credentials Info -->
            <div class="demo-credentials">
                <strong>Demo Credentials:</strong>
                Username: <code>admin</code><br>
                Password: <code>admin123</code>
            </div>

            <!-- Error/Success Message -->
            <div id="loginMessage" class="error-message"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                
                <!-- Username Field -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    Sign In to Dashboard
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>
                    🔒 Your data is stored securely in your browser<br>
                    No server connection required
                </p>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script src="js/login.js"></script>

</body>
</html>
